[package]
name = "faktury"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.9"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
typst-as-lib = { version = "0.17", features = ["packages", "ureq"] }
typst-pdf = "0.15"

[build-dependencies]
slint-build = "1.9"
